<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 - Agent 工作流管理平台</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .topbar {
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid rgba(71, 85, 105, 0.4);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .topbar .brand {
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .topbar .back-btn {
            padding: 0.4rem 1rem;
            background: rgba(71, 85, 105, 0.3);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #94a3b8;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .topbar .back-btn:hover {
            background: rgba(71, 85, 105, 0.5);
            color: #e2e8f0;
        }
        .topbar .topbar-actions {
            display: flex; gap: 0.5rem; align-items: center;
        }
        .btn-terminate-detail {
            padding: 0.4rem 1rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: none;
        }
        .btn-terminate-detail:hover {
            background: rgba(239, 68, 68, 0.35);
            color: #fecaca;
        }
        .btn-terminate-detail:disabled {
            opacity: 0.4; cursor: not-allowed;
        }
        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 800px) {
            .main { grid-template-columns: 1fr; }
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.4);
            border-radius: 14px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }
        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card h2::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 2px;
        }
        .card.full-width {
            grid-column: 1 / -1;
        }

        /* 元数据区 */
        .meta-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.4rem 1rem;
            font-size: 0.85rem;
        }
        .meta-grid .label {
            color: #64748b;
            white-space: nowrap;
        }
        .meta-grid .value {
            color: #cbd5e1;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }
        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .status-badge.running { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
        .status-badge.finished { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .status-badge.error, .status-badge.terminated { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .status-badge.pending, .status-badge.created { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }

        /* 任务进度 */
        .progress-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            max-height: 260px;
            overflow-y: auto;
        }
        .progress-entry {
            padding: 0.4rem 0.6rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 6px;
            font-size: 0.82rem;
            color: #cbd5e1;
            border-left: 2px solid #38bdf8;
        }
        .progress-entry .entry-time {
            font-size: 0.65rem;
            color: #475569;
            display: block;
            margin-top: 0.15rem;
        }
        /* 进度卡内的 Markdown 内容 */
        .progress-entry p { margin: 0.25rem 0; }
        .progress-entry code {
            background: rgba(56, 189, 248, 0.15);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.78rem;
            color: #7dd3fc;
        }
        .progress-entry strong { color: #e2e8f0; }
        .progress-entry ul, .progress-entry ol { margin: 0.25rem 0; padding-left: 1.2rem; }
        .progress-entry a { color: #38bdf8; }
        /* 进度卡内 已完成 / 未完成 颜色 */
        .progress-entry .done { color: #38bdf8; font-weight: 600; }
        .progress-entry .undone { color: #ef4444; font-weight: 600; }

        /* 日志行高亮 */
        .log-user-line { color: #38bdf8; font-weight: 700; }

        /* 日志 */
        .log-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            line-height: 1.6;
            max-height: 420px;
            overflow-y: auto;
            overflow-wrap: break-word;
            color: #94a3b8;
            min-height: 120px;
        }
        .log-container p { margin: 0.3rem 0; }
        .log-container code {
            background: rgba(56, 189, 248, 0.12);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.78rem;
            color: #7dd3fc;
        }
        .log-container strong { color: #e2e8f0; }
        .log-container .empty { color: #475569; font-style: italic; }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .log-header .refresh-tag {
            font-size: 0.65rem;
            color: #475569;
        }
        .log-lines { font-size: 0.7rem; color: #475569; margin-top: 0.3rem; }
        .log-header .log-tools {
            display: flex; align-items: center; gap: 0.6rem;
        }
        .btn-mini {
            padding: 0.25rem 0.7rem;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 6px;
            color: #7dd3fc;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-mini:hover { background: rgba(56, 189, 248, 0.25); color: #bae6fd; }
        .btn-mini:disabled { opacity: 0.45; cursor: not-allowed; }
        /* 节点执行轨迹：小字灰色，与 Agent 正文区分 */
        .log-trace { color: #475569; }
        /* 向上加载时插入的分隔提示 */
        .log-older-mark {
            text-align: center; color: #475569;
            font-size: 0.7rem; margin: 0.4rem 0;
            border-top: 1px dashed rgba(71, 85, 105, 0.4); padding-top: 0.3rem;
        }

        /* 输入框卡片 */
        .input-card {
            grid-column: 1 / -1;
        }
        .input-row {
            display: flex;
            gap: 0.75rem;
            align-items: stretch;
        }
        .input-row textarea {
            flex: 1;
            padding: 0.6rem 0.8rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.85rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row textarea:focus {
            border-color: #38bdf8;
        }
        .input-row textarea::placeholder {
            color: #475569;
        }
        .btn-send {
            padding: 0.75rem 1.5rem;
            background: rgba(71, 85, 105, 0.4);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #64748b;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: not-allowed;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-send.active {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            color: #fff;
            cursor: pointer;
        }
        .btn-send.active:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        .btn-send:disabled {
            opacity: 1;
            cursor: not-allowed;
            transform: none;
        }

        /* ---- CLI 执行浮层卡片 ---- */
        .cli-float {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 460px;
            max-width: calc(100vw - 40px);
            background: rgba(15, 23, 42, 0.97);
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 12px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
            z-index: 999;
            display: none;
            overflow: hidden;
        }
        .cli-float.active { display: block; }
        .cli-float .cli-head {
            display: flex; align-items: center; gap: .5rem;
            padding: .7rem 1rem;
            background: linear-gradient(135deg, rgba(56,189,248,.22), rgba(129,140,248,.22));
            border-bottom: 1px solid rgba(148,163,184,.25);
            font-weight: 700; font-size: .95rem;
        }
        .cli-float .cli-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #38bdf8; box-shadow: 0 0 8px #38bdf8;
            animation: cliPulse 1.1s infinite;
        }
        @keyframes cliPulse { 0%,100%{opacity:1} 50%{opacity:.25} }
        .cli-float .cli-body { padding: .8rem 1rem; }
        .cli-float .cli-cmd {
            font-family: Consolas, "Courier New", monospace;
            font-size: .82rem;
            background: rgba(2,6,23,.75);
            border: 1px solid rgba(148,163,184,.2);
            border-radius: 6px;
            padding: .5rem .6rem;
            color: #e2e8f0;
            max-height: 92px; overflow: auto;
            white-space: pre-wrap; word-break: break-all;
        }
        .cli-float .cli-meta {
            display: flex; gap: 1rem; flex-wrap: wrap;
            margin: .55rem 0; font-size: .78rem; color: #94a3b8;
        }
        .cli-float .cli-meta b { color: #e2e8f0; }
        .cli-float .cli-last {
            font-family: Consolas, "Courier New", monospace;
            font-size: .78rem; color: #cbd5e1;
            background: rgba(2,6,23,.55); border-radius: 6px;
            padding: .4rem .55rem; max-height: 62px; overflow: hidden;
        }
        .cli-float .cli-actions {
            display: flex; justify-content: flex-end; gap: .5rem;
            padding: 0 1rem .85rem;
        }
        .btn-cli-kill {
            padding: .35rem .9rem; border-radius: 6px; cursor: pointer;
            background: rgba(239,68,68,.18);
            border: 1px solid rgba(239,68,68,.5);
            color: #fca5a5; font-size: .82rem;
        }
        .btn-cli-kill:hover { background: rgba(239,68,68,.32); color: #fecaca; }
        .btn-cli-kill:disabled { opacity: .45; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="brand">&#9889; Agent 任务详情</span>
        <div class="topbar-actions">
            <button class="btn-terminate-detail" id="btnTerminateDetail" onclick="terminateTask()">&#10005; 请求中断</button>
            <a href="/" class="back-btn">&larr; 返回主页</a>
        </div>
    </div>

    <div class="main">
        <!-- 元数据卡片 -->
        <div class="card" id="metaCard">
            <h2>任务信息</h2>
            <div class="meta-grid" id="metaContent">加载中...</div>
        </div>

        <!-- 任务进度卡片 -->
        <div class="card" id="nodesCard">
            <h2>任务进度</h2>
            <div class="progress-list" id="progressList">加载中...</div>
        </div>

        <!-- 日志卡片（全宽） -->
        <div class="card full-width" id="logCard">
            <div class="log-header">
                <h2>任务日志</h2>
                <div class="log-tools">
                    <button class="btn-mini" id="btnLoadEarlier"
                            onclick="loadEarlierLog()"
                            style="display:none;">&#8593; 加载更早的日志</button>
                    <span class="refresh-tag">每 0.5 秒自动刷新</span>
                </div>
            </div>
            <div class="log-container" id="logContent">
                <span class="empty">加载中...</span>
            </div>
            <div class="log-lines" id="logLines"></div>
        </div>

        <!-- 交互输入卡片（全宽），位于日志下方 -->
        <div class="card full-width input-card" id="inputCard">
            <h2>消息输入</h2>
            <div class="input-row">
                <textarea id="msgInput" placeholder="等待 Agent 发起提问..." rows="1" disabled></textarea>
                <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled>发送</button>
            </div>
        </div>
    </div>

    <!-- CLI 执行浮层卡片：展示命令 / 进度 / 终止按钮 -->
    <div class="cli-float" id="cliFloat">
        <div class="cli-head"><span class="cli-dot"></span>CLI 命令执行中</div>
        <div class="cli-body">
            <div class="cli-cmd" id="cliCommand">-</div>
            <div class="cli-meta">
                <span>运行时长 <b id="cliElapsed">0s</b></span>
                <span>输出 <b id="cliLines">0</b> 行</span>
                <span>PID <b id="cliPid">-</b></span>
            </div>
            <div class="cli-last" id="cliLastLine">等待输出...</div>
        </div>
        <div class="cli-actions">
            <button class="btn-cli-kill" id="btnKillCli" onclick="killCli()">终止命令</button>
        </div>
    </div>

    <script>
        // 从 URL 提取 task_uuid: /task/<uuid>/detail
        const pathParts = window.location.pathname.split('/');
        const taskUuid = pathParts[2] || '';

        // ---- 渲染任务进度（Markdown 解析）----
        let _prevProgressHtml = null;
        function renderNodes(data) {
            const el = document.getElementById('progressList');
            const newProgressText = data.progress_text || '';
            let newHtml;
            if (newProgressText) {
                let mdHtml = marked.parse(newProgressText);
                // 已完成 / 未完成 着色
                mdHtml = mdHtml
                    .replace(/已完成/g, '<span class="done">已完成</span>')
                    .replace(/未完成/g, '<span class="undone">未完成</span>');
                newHtml = `<div class="progress-entry">
                    <div class="progress-md">${mdHtml}</div>
                    <span class="entry-time">${formatTime(data.progress_time)}</span>
                </div>`;
            } else {
                newHtml = '<div class="progress-entry" style="color:#475569;border-left-color:#475569;">等待任务启动...</div>';
            }
            // 与上次拼装输出比较（确定性），内容不变则绝不重建，保护选区
            if (_prevProgressHtml !== newHtml) {
                _prevProgressHtml = newHtml;
                el.innerHTML = newHtml;
                el.scrollTop = el.scrollHeight;
            }
        }

        // ---- 状态文案映射 ----
        const STATUS_MAP = {
            'running': '运行中',
            'finished': '已完成',
            'force_terminated': '手动终止',
            'immediately_terminated': '已中断',
            'created': '已创建',
            'init': '初始化中',
            'web_ui_ready': '界面就绪',
            'awaiting_input': '等待输入',
            'terminating': '中断中',
        };

        // ---- 渲染 CLI 浮层 ----
        function renderCli(data) {
            const cli = (data.extra || {}).cli;
            const box = document.getElementById('cliFloat');
            if (!cli || !cli.running) {
                box.classList.remove('active');
                return;
            }
            box.classList.add('active');
            document.getElementById('cliCommand').textContent = cli.command || '-';
            document.getElementById('cliPid').textContent = (cli.pid !== undefined && cli.pid !== null) ? cli.pid : '-';
            document.getElementById('cliLines').textContent = cli.lines || 0;
            document.getElementById('cliLastLine').textContent = cli.last_line || '等待输出...';

            const t0 = cli.started_at ? new Date(cli.started_at).getTime() : Date.now();
            const sec = Math.max(0, Math.floor((Date.now() - t0) / 1000));
            document.getElementById('cliElapsed').textContent =
                sec >= 60 ? `${Math.floor(sec / 60)}m ${sec % 60}s` : `${sec}s`;

            const btn = document.getElementById('btnKillCli');
            btn.disabled = !!cli.killing;
            btn.textContent = cli.killing ? '终止中...' : '终止命令';
        }

        // ---- 终止 CLI ----
        async function killCli() {
            const btn = document.getElementById('btnKillCli');
            if (btn.disabled) return;
            if (!confirm('确定要终止当前正在执行的 CLI 命令吗？\n终止后节点会自然结束，流程将暂停并等待你的下一步指令。')) return;
            btn.disabled = true;
            btn.textContent = '终止中...';
            try {
                const resp = await fetch(`/task/${taskUuid}/cli/kill`, { method: 'POST' });
                const d = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    alert(d.detail || '终止失败');
                    btn.disabled = false;
                    btn.textContent = '终止命令';
                }
            } catch (e) {
                alert('终止请求失败：' + e);
                btn.disabled = false;
                btn.textContent = '终止命令';
            }
        }

        // ---- 刷新状态 ----
        async function refreshStatus() {
            try {
                const resp = await fetch(`/task/${taskUuid}/status`);
                if (!resp.ok) throw new Error('Not found');
                const data = await resp.json();
                renderMeta(data);
                renderNodes(data);
                renderCli(data);
                updateInputState(data);
            } catch (e) {
                // 失败时不重建 DOM，避免清空选区
                console.error('状态刷新失败:', e);
            }
        }

        // ---- 日志读取（字节窗口：增量追加 + 向上翻页）----
        let _logStart = -1;      // 已加载的最早字节偏移
        let _logEnd = -1;        // 已加载的最新字节偏移
        let _logSize = 0;        // 日志总字节数
        let _logBusy = false;

        function _renderLogMd(text) {
            let html = marked.parse(text);
            // 用户回答行标蓝色加粗
            html = html.replace(
                /<p>用户回答：([\s\S]*?)<\/p>/g,
                '<p class="log-user-line">用户回答：$1</p>'
            );
            return html;
        }

        function _isLogPinnedBottom(el) {
            return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
        }

        function _updateLogMeta(d) {
            _logSize = d.size || 0;
            const loaded = _logStart < 0 ? 0 : _logStart;
            const pct = _logSize
                ? Math.round(100 * (_logEnd < 0 ? 0 : _logEnd) / _logSize)
                : 0;
            document.getElementById('logLines').textContent =
                _logSize ? `已加载 ${loaded} / ${_logSize} 字节（${pct}%）` : '';
            document.getElementById('btnLoadEarlier').style.display =
                (_logStart > 0) ? 'inline-block' : 'none';
        }

        // 轮询：首次取末尾窗口，之后只取增量（耗时与日志总长无关）
        async function refreshLog() {
            if (_logBusy) return;
            _logBusy = true;
            try {
                const q = _logEnd < 0 ? 'limit=65536' : `after=${_logEnd}`;
                const resp = await fetch(`/task/${taskUuid}/log/window?${q}`);
                const data = await resp.json();
                const el = document.getElementById('logContent');

                if (data.log) {
                    const pinned = (_logEnd < 0) || _isLogPinnedBottom(el);
                    if (el.querySelector('.empty')) el.innerHTML = '';
                    const wrap = document.createElement('div');
                    wrap.innerHTML = _renderLogMd(data.log);
                    el.appendChild(wrap);              // 只追加，不动已有节点（保护选区）
                    if (pinned) el.scrollTop = el.scrollHeight;
                }

                if (_logEnd < 0) {
                    // 首次加载：记录窗口起点，必要时显示"暂无日志"
                    _logStart = data.start;
                    if (!data.log && el.querySelector('.empty')) {
                        el.innerHTML = '<span class="empty">暂无日志输出...</span>';
                    }
                }
                _logEnd = data.end;
                _updateLogMeta(data);
            } catch (e) {
                // 失败时绝不重建日志 DOM（会清空用户选区），仅静默记录
                console.error('日志刷新失败:', e);
            } finally {
                _logBusy = false;
            }
        }

        // 向上加载更早的日志，并保持视口内容不跳动
        async function loadEarlierLog() {
            if (_logBusy || _logStart <= 0) return;
            _logBusy = true;
            const el = document.getElementById('logContent');
            const btn = document.getElementById('btnLoadEarlier');
            btn.disabled = true;
            btn.textContent = '加载中...';
            try {
                const resp = await fetch(
                    `/task/${taskUuid}/log/window?before=${_logStart}&limit=131072`);
                const data = await resp.json();
                if (data.log) {
                    const prevHeight = el.scrollHeight;
                    const wrap = document.createElement('div');
                    wrap.innerHTML = _renderLogMd(data.log);
                    el.insertBefore(wrap, el.firstChild);   // 前插
                    el.scrollTop += el.scrollHeight - prevHeight;  // 补偿高度，视口不动
                }
                _logStart = data.start;
                _updateLogMeta(data);
            } catch (e) {
                console.error('加载更早日志失败:', e);
            } finally {
                _logBusy = false;
                btn.disabled = false;
                btn.textContent = '\u2191 加载更早的日志';
            }
        }

        // 滚到顶部附近自动加载更早的日志
        document.getElementById('logContent').addEventListener('scroll', function (e) {
            if (e.target.scrollTop < 80 && _logStart > 0) loadEarlierLog();
        });

        // ---- 渲染元数据 ----
        let _prevMetaHtml = null;
        function renderMeta(data) {
            const statusText = STATUS_MAP[data.status] || data.status || '未知';
            const isRunning = data.is_running;
            const badgeClass = getStatusClass(data.status);

            // 控制中断按钮显隐
            const btn = document.getElementById('btnTerminateDetail');
            btn.style.display = isRunning ? 'inline-block' : 'none';
            if (!isRunning) { btn.disabled = false; btn.textContent = '✕ 强制中断'; }

            const newHtml = `
                <span class="label">Task UUID</span>
                <span class="value">${data.task_uuid}</span>
                <span class="label">状态</span>
                <span class="value"><span class="status-badge ${badgeClass}">${statusText}</span> ${isRunning ? '&#9679; 活跃' : '&#9675; 已结束'}</span>
                <span class="label">消息</span>
                <span class="value">${escapeHtml(data.input_msg || '-')}</span>
                <span class="label">工作目录</span>
                <span class="value">${escapeHtml(data.root_workspace || '-')}</span>
                <span class="label">当前节点</span>
                <span class="value">${data.current_node || '-'}</span>
                <span class="label">创建时间</span>
                <span class="value">${formatTime(data.created_at)}</span>
                <span class="label">更新时间</span>
                <span class="value">${formatTime(data.updated_at)}</span>
                <span class="label">窗口词元</span>
                <span class="value">${data.token}</span>
            `;
            const metaEl = document.getElementById('metaContent');
            // 与上次拼装输出比较（确定性），内容不变则绝不重建，保护选区
            if (_prevMetaHtml !== newHtml) {
                _prevMetaHtml = newHtml;
                metaEl.innerHTML = newHtml;
            }
        }

        // ---- 辅助函数 ----
        function getStatusClass(status) {
            if (!status) return '';
            if (status.includes('running') || status.includes('ready')) return 'running';
            if (status === 'finished') return 'finished';
            if (status.includes('terminated') || status === 'error') return 'error';
            return 'pending';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '-';
            try {
                const d = new Date(iso);
                return d.toLocaleTimeString('zh-CN', { hour12: false });
            } catch {
                return iso;
            }
        }

        // ---- 请求中断（等当前节点结束后转入人工介入）----
        async function terminateTask() {
            if (!confirm('确定要请求中断吗？\n当前节点执行完毕后流程会暂停，等待你的下一步指令。')) return;
            const btn = document.getElementById('btnTerminateDetail');
            btn.disabled = true;
            btn.textContent = '中断中...';
            try {
                const resp = await fetch(`/terminate/${taskUuid}`, { method: 'POST' });
                const data = await resp.json().catch(() => ({}));
                alert(data.msg || data.detail || '已请求中断');
                btn.disabled = false;
                btn.textContent = '请求中断';
            } catch (err) {
                alert('中断请求失败：' + err);
                btn.disabled = false;
                btn.textContent = '请求中断';
            }
            refreshStatus();
            refreshLog();
        }

        // ---- 发送消息 ----
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('btnSend');

            if (btn.disabled) return;

            const msg = input.value.trim();
            if (!msg) return;

            btn.disabled = true;
            btn.textContent = '发送中...';
            btn.classList.remove('active');

            try {
                const resp = await fetch(`/task/${taskUuid}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                if (resp.ok) {
                    input.value = '';
                    input.disabled = true;
                    input.placeholder = '等待 Agent 发起提问...';
                    btn.classList.remove('active');
                    btn.textContent = '发送';
                } else {
                    enableInput();
                }
            } catch (err) {
                enableInput();
            }
        }

        // ---- 输入框状态管理 ----
        function enableInput() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('btnSend');
            const wasDisabled = input.disabled;
            input.disabled = false;
            btn.disabled = false;
            btn.classList.add('active');
            // 仅当输入框刚从禁用变为启用时才抢焦点，避免每轮轮询打断复制
            if (wasDisabled) {
                input.focus();
            }
        }

        function disableInput() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('btnSend');
            input.disabled = true;
            input.placeholder = '等待 Agent 发起提问...';
            btn.disabled = true;
            btn.classList.remove('active');
        }

        function updateInputState(data) {
            const extra = data.extra || {};
            if (extra.awaiting_input) {
                enableInput();
            } else {
                disableInput();
            }
        }

        // ---- Enter 发送（Shift+Enter 换行）----
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('msgInput');
            if (input) {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }
        });

        // ---- 启动 ----
        if (!taskUuid) {
            document.body.innerHTML = '<div style="text-align:center;padding:4rem;color:#fca5a5;">缺少 task_uuid</div>';
        } else {
            refreshStatus();
            refreshLog();
            setInterval(refreshStatus, 500);
            setInterval(refreshLog, 500);
        }
    </script>
</body>
</html>
