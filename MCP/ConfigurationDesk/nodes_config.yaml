# ============================================================
# ConfigurationDesk Bus Manager MCP —— 业务节点配置
# 节点名 == router 意图名；tools_scope 为新增可选字段，
# 用于按意图绑定 MCP 工具子集（见 TA_Nodes.py 集成说明）
# ============================================================
nodes:
  cfd_bootstrap:
    prompt_key: cfd_bootstrap_node
    use_tools: true
    interrupt: false
    fallback_to: task_manage
    tools_scope: cfd_bootstrap

  cfd_project_setup:
