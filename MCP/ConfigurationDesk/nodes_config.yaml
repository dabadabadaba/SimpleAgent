    interrupt: false
    fallback_to: task_manage
    tools_scope: cfd_working_view

  cfd_inspect:
    prompt_key: cfd_inspect_node
    use_tools: true
    interrupt: false
    fallback_to: task_manage
    tools_scope: cfd_inspect

router_valid_intents:
  - cfd_bootstrap
  - cfd_project_setup
  - cfd_matrix_import
  - cfd_bus_config
  - cfd_model_chain
  - cfd_io_functions
  - cfd_hardware
  - cfd_build
