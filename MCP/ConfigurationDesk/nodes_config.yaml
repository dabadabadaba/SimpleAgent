    use_tools: true
    interrupt: false
    fallback_to: task_manage
    tools_scope: cfd_matrix_import

  cfd_bus_config:
    prompt_key: cfd_bus_config_node
    use_tools: true
    interrupt: false
    fallback_to: task_manage
    tools_scope: cfd_bus_config

  cfd_model_chain:
    prompt_key: cfd_model_chain_node
    use_tools: true
    interrupt: false
    fallback_to: task_manage
    tools_scope: cfd_model_chain

  cfd_io_functions:
    prompt_key: cfd_io_functions_node
    use_tools: true
    interrupt: false
    fallback_to: task_manage
    tools_scope: cfd_io_functions

  cfd_hardware:
    prompt_key: cfd_hardware_node
    use_tools: true
    interrupt: false
    fallback_to: task_manage
